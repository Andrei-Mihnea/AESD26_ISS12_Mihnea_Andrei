spring.application.name=lab4
# Security stays enabled unless dev is explicitly selected.
spring.profiles.default=prod
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab4}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lab4}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab4}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Flyway owns schema changes; Hibernate only validates the resulting mappings.
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m,recordStats
app.seed.depots=${APP_SEED_DEPOTS:10}
app.seed.vehicles=${APP_SEED_VEHICLES:50}
app.seed.customers=${APP_SEED_CUSTOMERS:1000}
app.seed.deliveries-per-customer=${APP_SEED_DELIVERIES_PER_CUSTOMER:3}

# Swagger UI opens the preferred version; both remain available in its definition selector.
springdoc.swagger-ui.urls-primary-name=v2

# One-time database bootstrap credentials for the security lab.
app.security.username=${APP_SECURITY_USERNAME:student}
app.security.password=${APP_SECURITY_PASSWORD:lab-password}
# Bearer tokens are sent in headers; the former cookie/CSRF flow is no longer used.
springdoc.swagger-ui.csrf.enabled=false

app.security.customer.username=${APP_SECURITY_CUSTOMER_USERNAME:customer}
app.security.customer.password=${APP_SECURITY_CUSTOMER_PASSWORD:customer-password}
app.security.driver.username=${APP_SECURITY_DRIVER_USERNAME:driver}
app.security.driver.password=${APP_SECURITY_DRIVER_PASSWORD:driver-password}

# Base64-encoded HMAC key. Empty uses a secure per-process key for local development.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:lab4}
app.security.jwt.audience=${JWT_AUDIENCE:lab4-api}
app.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
app.security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}

# Optional second, fixed issuer. Local BCrypt login remains available.
app.security.oidc.issuer-uri=${OIDC_ISSUER_URI:}
app.security.oidc.audience=${OIDC_AUDIENCE:lab4-api}
app.security.oidc.client-id=${OIDC_CLIENT_ID:lab4-web}
springdoc.swagger-ui.oauth.client-id=${OIDC_CLIENT_ID:lab4-web}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
