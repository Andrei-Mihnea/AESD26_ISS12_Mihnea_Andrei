spring.application.name=lab4
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab4}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:lab4}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab4}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m,recordStats
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.depots=${APP_SEED_DEPOTS:10}
app.seed.vehicles=${APP_SEED_VEHICLES:50}
app.seed.customers=${APP_SEED_CUSTOMERS:1000}
app.seed.deliveries-per-customer=${APP_SEED_DELIVERIES_PER_CUSTOMER:3}
