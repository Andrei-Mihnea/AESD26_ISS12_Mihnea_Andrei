spring.application.name=OptimizationWorker
spring.main.web-application-type=none
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:vros}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:vros-password}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.default-requeue-rejected=false
optimization.worker.retry.max-attempts=${OPTIMIZATION_RETRY_MAX_ATTEMPTS:3}
optimization.worker.retry.delay-ms=${OPTIMIZATION_RETRY_DELAY_MS:200}
